name: Release
# Push a tag like v1.2.3 to publish: plugin zip, manifest.json, one-file installers, SHA256SUMS.
# (A tag like v1.2.3-rc1 publishes a GitHub *pre*release only; it never touches the stable manifest on main.)
# The Fire TV app is NOT built here: .github/workflows/firetv.yml builds, signs and publishes it
# (releases/download/firetv-latest/FullUI-release.apk).
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false   # two tags pushed close together must not race on manifest.json

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
        working-directory: web
      - run: npm run typecheck && npm test && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with: { name: web-bundle, path: web/dist }

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet test server/Jellyfin.Plugin.FullUI.Tests -c Release
      - run: dotnet test server/Jellyfin.Plugin.FullUI.DiscoveryTests -c Release

  # Proves the plugin binary works against every supported Jellyfin (10.11.6 .. latest 10.11.x); needs network access to nuget.
  abi-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet build server/Jellyfin.Plugin.FullUI -c Release
      - name: ABI matrix (fails on any incompatibility)
        run: bash tools/abi-matrix.sh

  installer-tests:
    uses: ./.github/workflows/installer-tests.yml

  plugin:
    # nothing is built for publishing until every test has passed
    needs: [web, server-tests, abi-matrix, installer-tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/download-artifact@v4
        with: { name: web-bundle, path: server/Jellyfin.Plugin.FullUI/Web }
      - name: Work out the version from the tag (v1.2.3 -> 1.2.3.0; v1.2.3-rc1 -> 1.2.2.9001, below the final)
        id: ver
        run: echo "version=$(python3 installer/make_release.py version --tag "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"
      - run: dotnet build server/Jellyfin.Plugin.FullUI -c Release -p:Version=${{ steps.ver.outputs.version }} -p:AssemblyVersion=${{ steps.ver.outputs.version }} -p:FileVersion=${{ steps.ver.outputs.version }}
      - name: Zip the plugin (dll + meta.json); fails on any unaccounted dependency DLL
        run: python3 installer/make_release.py pack --tag "${GITHUB_REF_NAME}" --bin-dir server/Jellyfin.Plugin.FullUI/bin/Release/net9.0 --out-dir out
      - uses: actions/upload-artifact@v4
        with: { name: plugin-zip, path: out/*.zip }

  release:
    needs: [plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may publish / push
    steps:
      - uses: actions/checkout@v4
        with: { path: src, fetch-depth: 0 }
      - name: Check out main (the stable manifest lives there)
        uses: actions/checkout@v4
        with: { ref: main, path: mainbranch }
      - uses: actions/download-artifact@v4
        with: { name: plugin-zip, path: out }
      - name: Changelog from commits since the previous release tag
        id: log
        working-directory: src
        run: |
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="$PREV..${GITHUB_REF_NAME}"; else RANGE="${GITHUB_REF_NAME}"; fi
          # a random delimiter: a commit subject can never end the block early
          DELIM="CHANGELOG_$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          { echo "text<<$DELIM"; git log --pretty='format:- %s' "$RANGE" | head -n 30; echo; echo "$DELIM"; } >> "$GITHUB_OUTPUT"
      - name: Generate manifest.json (adds this version, keeps older ones)
        env:
          CHANGELOG: ${{ steps.log.outputs.text }}
        run: |
          python3 src/installer/make_release.py manifest --manifest mainbranch/manifest.json --output out/manifest.json \
            --tag "${GITHUB_REF_NAME}" --zip out/FullUI_*.zip --repo "${GITHUB_REPOSITORY}" --changelog "$CHANGELOG"
          cat out/manifest.json
      - name: Build the one-file installers and the checksum list
        run: |
          python3 src/installer/build_single.py out
          cp src/installer/install.ps1 src/installer/fullui_install.py src/installer/install.sh src/installer/Install-FullUI.cmd out/
          cd out
          sha256sum FullUI_*.zip manifest.json FullUI-Installer.cmd FullUI-Installer.sh install.ps1 fullui_install.py install.sh Install-FullUI.cmd > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            out/FullUI_*.zip
            out/manifest.json
            out/FullUI-Installer.cmd
            out/FullUI-Installer.sh
            out/install.ps1
            out/fullui_install.py
            out/install.sh
            out/Install-FullUI.cmd
            out/SHA256SUMS
      - name: Update manifest.json on main (stable raw URL used by Jellyfin)
        # Fails the run (red X) if it cannot be done: then new versions would not reach users who added the raw URL.
        if: ${{ !contains(github.ref_name, '-') }}
        working-directory: mainbranch
        env:
          CHANGELOG: ${{ steps.log.outputs.text }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            # start from the newest main every time and add this version again (a rebase of a JSON file would only conflict)
            git fetch origin main
            git reset --hard origin/main
            python3 ../src/installer/make_release.py manifest --manifest manifest.json --output manifest.json \
              --tag "${GITHUB_REF_NAME}" --zip ../out/FullUI_*.zip --repo "${GITHUB_REPOSITORY}" --changelog "$CHANGELOG"
            git add manifest.json
            if git diff --cached --quiet; then echo "manifest on main already has this version"; exit 0; fi
            git commit -m "Release ${GITHUB_REF_NAME}: update plugin manifest"
            if git push origin HEAD:main; then echo "manifest pushed on attempt $attempt"; exit 0; fi
            echo "push to main was rejected (attempt $attempt of 5); retrying with the newest main"
            sleep $((attempt * 5))
          done
          echo "::error title=manifest.json on main was NOT updated::The release assets are published, and the fallback address https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json has the new version, but the stable raw URL still serves the old list. Is main protected? Allow github-actions to push, or merge out/manifest.json by hand."
          exit 1
