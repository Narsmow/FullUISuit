name: Release
# Push a tag like v1.2.3 to publish: plugin zip, manifest.json, one-file installers, Fire TV APK (when firetv/ exists).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
        working-directory: web
      - run: npm run typecheck && npm test && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with: { name: web-bundle, path: web/dist }

  plugin:
    needs: web
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }
      - uses: actions/download-artifact@v4
        with: { name: web-bundle, path: server/Jellyfin.Plugin.FullUI/Web }
      - name: Work out the version from the tag (v1.2.3 -> 1.2.3.0)
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          V="$(python3 - "$TAG" <<'PY'
          import re,sys
          m=re.match(r'^v?(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?',sys.argv[1])
          print('%s.%s.%s.%s'%(m.group(1),m.group(2),m.group(3),m.group(4) or '0')) if m else sys.exit('bad tag')
          PY
          )"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: dotnet build server/Jellyfin.Plugin.FullUI -c Release -p:Version=${{ steps.ver.outputs.version }} -p:AssemblyVersion=${{ steps.ver.outputs.version }} -p:FileVersion=${{ steps.ver.outputs.version }}
      - name: Zip the plugin (dll + meta.json)
        run: python3 installer/make_release.py pack --tag "${GITHUB_REF_NAME}" --bin-dir server/Jellyfin.Plugin.FullUI/bin/Release/net9.0 --out-dir out
      - uses: actions/upload-artifact@v4
        with: { name: plugin-zip, path: out/*.zip }

  firetv:
    # Tolerant: the Fire TV app may not exist yet, or may fail to build. The release goes ahead either way.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: |
          if [ -f firetv/gradlew ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No firetv/gradlew - skipping the APK."; fi
      - if: steps.has.outputs.present == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - if: steps.has.outputs.present == 'true'
        name: Build APK (release if signing is configured in Gradle, else debug-signed so it still installs)
        working-directory: firetv
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease || ./gradlew --no-daemon assembleDebug
          APK="$(find . -path '*outputs/apk*' -name '*.apk' ! -name '*unsigned*' | sort | head -n1)"
          [ -n "$APK" ] || { echo "no installable apk produced"; exit 1; }
          mkdir -p ../out && cp "$APK" ../out/FullUI-FireTV.apk
      - if: steps.has.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with: { name: firetv-apk, path: out/FullUI-FireTV.apk }

  release:
    needs: [plugin, firetv]
    # run even if firetv failed or was skipped
    if: ${{ !cancelled() && needs.plugin.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src, fetch-depth: 0 }
      - name: Check out main (the stable manifest lives there)
        uses: actions/checkout@v4
        with: { ref: main, path: mainbranch }
      - uses: actions/download-artifact@v4
        with: { name: plugin-zip, path: out }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: firetv-apk, path: out }
      - name: Changelog from commits since the previous tag
        id: log
        working-directory: src
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="$PREV..${GITHUB_REF_NAME}"; else RANGE="${GITHUB_REF_NAME}"; fi
          { echo 'text<<EOF'; git log --pretty='format:- %s' "$RANGE" | head -n 30; echo; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - name: Generate manifest.json (adds this version, keeps older ones)
        env:
          CHANGELOG: ${{ steps.log.outputs.text }}
        run: |
          python3 src/installer/make_release.py manifest --manifest mainbranch/manifest.json --output out/manifest.json \
            --tag "${GITHUB_REF_NAME}" --zip out/FullUI_*.zip --repo "${GITHUB_REPOSITORY}" --changelog "$CHANGELOG"
          cat out/manifest.json
      - name: Build the one-file installers
        run: |
          python3 src/installer/build_single.py out
          cp src/installer/install.ps1 src/installer/fullui_install.py src/installer/install.sh src/installer/Install-FullUI.cmd out/ || true
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            out/FullUI_*.zip
            out/manifest.json
            out/FullUI-Installer.cmd
            out/FullUI-Installer.sh
            out/install.ps1
            out/fullui_install.py
            out/install.sh
            out/Install-FullUI.cmd
            out/FullUI-FireTV.apk
      - name: Update manifest.json on main (stable raw URL used by Jellyfin)
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true   # protected branch? the release asset URL still works as a fallback
        working-directory: mainbranch
        run: |
          cp ../out/manifest.json manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && { echo "manifest unchanged"; exit 0; }
          git commit -m "Release ${GITHUB_REF_NAME}: update plugin manifest"
          git push origin HEAD:main
